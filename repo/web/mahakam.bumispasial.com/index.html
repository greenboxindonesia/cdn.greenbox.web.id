            };

          },

          onEachFeature: function (feature, layer) {

              mouseover: function (e) { 
                var layer = e.target; 
                layer.setStyle({ 
                  weight: 2, 
                  color: "#00FFFF", 
                  opacity: 1, 
                  fillColor: "yellow", 
                  fillOpacity: 0.2,

              },
              mouseout: function (e) { 
                das_mahakam.resetStyle(e.target); 
                map.closePopup();

              click: function (e) {

        $.getJSON("data/das_mahakam.geojson", function (data) {
          das_mahakam.addData(data);
          map.addLayer(das_mahakam);

      };

          var layerControl = L.control.layers(baseMaps,layers, {collapsed:false});
      layerControl.addTo(map)
// Control legend
var legend = L.control({position: 'bottomright'}), legenditem;

legend.onAdd = function (map) {
  this._div = L.DomUtil.create('div', 'legend'), legenditem = [];
  this.update();
  return this._div;
};

legend.update = function () {
  this._div.innerHTML = '<h5>Legenda</h5><hr>' + legenditem.join('<hr>');
};

legend.addTo(map);
//================================================= Legend for each layer
var legend_sungai = '<img src="assets/images/sungai.png" width="60">',
legend_danau = '<img class="imglegend" src="assets/images/danau.png" width="60">',
legend_subdas = '<img class="imglegend" src="assets/images/subdas.png" width="100">';
legend_wilayah = '<img class="imglegend" src="assets/images/admin.png" width="150">';

map.on("overlayadd", function(e) {
  if (e.layer === sungai) {
    legenditem.push(legend_sungai);
    legend.update();
  }
  if (e.layer === danau) {
    legenditem.push(legend_danau);
    legend.update();
  }
  if (e.layer === das_mahakam) {
    legenditem.push(legend_subdas);
    legend.update();
  }
  if (e.layer === wilayah) {
    legenditem.push(legend_wilayah);
    legend.update();
  }
});

map.on("overlayremove", function(e) {
  if (e.layer === sungai) {
    for( var i = 0; i < legenditem.length; i++){
      if ( legenditem[i] === legend_capitalpoint) {
        legenditem.splice(i, 1);
      }
    }
    legend.update();
  }
  if (e.layer === danau) {
    for( var i = 0; i < legenditem.length; i++){
      if ( legenditem[i] === legend_street) {
        legenditem.splice(i, 1);
      }
    }
    legend.update();
  }
  if (e.layer === das_mahakam) {
    for( var i = 0; i < legenditem.length; i++){
      if ( legenditem[i] === legend_subdas) {
        legenditem.splice(i, 1);
      }
    }
    legend.update();
  }
  if (e.layer === wilayah) {
    for( var i = 0; i < legenditem.length; i++){
      if ( legenditem[i] === legend_wilayah) {
        legenditem.splice(i, 1);
      }
    }
    legend.update();
  }
});
